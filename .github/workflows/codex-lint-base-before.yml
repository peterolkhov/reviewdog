name: Reviewdog ordinary lint chained bases BEFORE
on:
  push:
    branches: [codex/diagnose-chained-lint-file-bases]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOCACHE: ${{ runner.temp }}/devtools45-go-cache
      GOMODCACHE: ${{ runner.temp }}/devtools45-go-mod
      GOPATH: ${{ runner.temp }}/devtools45-go-path
    steps:
      - name: Checkout whole pinned upstream with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: reviewdog/reviewdog
          ref: 50f9c30e1d1cca4a6958ea93a9ed6fe3bdc25deb
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - name: Official Go 1.27.4
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
      - name: Exact diagnostic assets part 1
        run: printf '%s' '' > "$RUNNER_TEMP/devtools45-assets.b64"
      - name: Exact diagnostic assets part 2
        run: printf '%s' '' >> "$RUNNER_TEMP/devtools45-assets.b64"
      - name: Materialize locked untracked native test packet
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          raw_assets=zlib.decompress(base64.b64decode(Path(os.environ['RUNNER_TEMP'], 'devtools45-assets.b64').read_bytes()))
          assert hashlib.sha256(raw_assets).hexdigest()=='8fd7543b7fafc3ef6b7f90e692454830b966b62bc9607a0afdb2885a7b390f91'
          assets=json.loads(raw_assets)
          root = Path(os.environ['RUNNER_TEMP']) / 'devtools45-before'
          root.mkdir()
          for name, item in assets.items():
              data = base64.b64decode(item['base64'], validate=True)
              assert hashlib.sha256(data).hexdigest() == item['sha256'], name
              (root / name).write_bytes(data)
          print('DEVTOOLS45_PACKET_SHA256 ' + json.dumps({name: item['sha256'] for name, item in assets.items()}, sort_keys=True))
          PYTHON
      - name: Whole upstream baseline then exact native expected red
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/devtools45-before/native_before.py" "$GITHUB_WORKSPACE/upstream"
