name: Reviewdog134 absolute URI regression before repair
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/observe-reviewdog-absolute134
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - phase: base
          ref: 50f9c30e1d1cca4a6958ea93a9ed6fe3bdc25deb
        - phase: head
          ref: cdf2a255e82a708b105862db21a0a607bb977553
    env:
      PHASE: ${{ matrix.phase }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: peterolkhov/reviewdog
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.27.4
        cache: false
    - name: Stage immutable fixture and record whole source
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/reviewdog134"

        echo '''' | base64 --decode > "$RUNNER_TEMP/reviewdog134/fixture.go"

        echo '''' | base64 --decode > "$RUNNER_TEMP/reviewdog134/expected.json"

        echo '''' | base64 --decode > "$RUNNER_TEMP/reviewdog134/assess.py"

        echo '''' | base64 --decode > "$RUNNER_TEMP/reviewdog134/guard.py"

        cp "$RUNNER_TEMP/reviewdog134/fixture.go" parser/zz_reviewdog131_before_test.go

        python3 "$RUNNER_TEMP/reviewdog134/guard.py" before

        '
    - name: Run actual unchanged source and assess exact failures
      shell: bash
      run: 'set -euo pipefail

        test "$(go env GOVERSION)" = go1.27.4

        go version

        status=0

        go test -json ./parser -run ''^TestReviewdog131Before$'' -count=1 -timeout=2m > "$RUNNER_TEMP/reviewdog134/actual.jsonl" 2> "$RUNNER_TEMP/reviewdog134/stderr" || status=$?

        printf ''%s'' "$status" > "$RUNNER_TEMP/reviewdog134/status"

        cat "$RUNNER_TEMP/reviewdog134/actual.jsonl"

        cat "$RUNNER_TEMP/reviewdog134/stderr"

        set -e

        python3 "$RUNNER_TEMP/reviewdog134/guard.py" after

        python3 "$RUNNER_TEMP/reviewdog134/assess.py"

        '
