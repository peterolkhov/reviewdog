name: Reviewdog139 absolute URI repair gates
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/validate-reviewdog-absolute139
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          phase: before
        - os: ubuntu-24.04
          phase: after
        - os: windows-2025
          phase: windows
    env:
      PHASE: ${{ matrix.phase }}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
    - name: Preserve LF source bytes on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: 'set -euo pipefail

        git config --global core.autocrlf false

        git config --global core.eol lf

        '
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: peterolkhov/reviewdog
        ref: cdf2a255e82a708b105862db21a0a607bb977553
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.27.4
        cache: false
    - name: Stage frozen packet part 1
      shell: bash
      run: 'set -euo pipefail

        : > "$RUNNER_TEMP/reviewdog139.packet.b64"

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 2
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 3
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 4
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 5
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 6
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 7
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 8
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Stage frozen packet part 9
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' '''' >> "$RUNNER_TEMP/reviewdog139.packet.b64"

        '
    - name: Validate exact before or candidate source
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PYTHON'\nimport base64, hashlib, json, os, pathlib, zlib\np=pathlib.Path(os.environ['RUNNER_TEMP'])\ndata=base64.b64decode((p/'reviewdog139.packet.b64').read_text(),validate=True)\nassert hashlib.sha256(data).hexdigest() == '17a89eacd3df86d6e27975d001bf245d944a5d3bac41311295c4c62e98052048'\nroot=p/'reviewdog139';root.mkdir()\nfor name,value in json.loads(zlib.decompress(data)).items():\n    path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(base64.b64decode(value,validate=True))\nPYTHON\npython3 \"$RUNNER_TEMP/reviewdog139/run.py\"\n"
