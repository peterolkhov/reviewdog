name: Reviewdog ordinary lint chained bases AFTER
on:
  push:
    branches: [codex/devtools45-native-after]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CANDIDATE_SHA: cdf2a255e82a708b105862db21a0a607bb977553
    steps:
      - name: Checkout exact original owner with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: reviewdog/reviewdog
          ref: 50f9c30e1d1cca4a6958ea93a9ed6fe3bdc25deb
          fetch-depth: 0
          persist-credentials: false
          path: original
      - name: Checkout exact source-only candidate with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: peterolkhov/reviewdog
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Official Go 1.27.4 without caches
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
      - name: Materialize immutable diagnostic and verifier packet
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "GOCACHE=$RUNNER_TEMP/devtools45-after-go-cache"
            echo "GOMODCACHE=$RUNNER_TEMP/devtools45-after-go-mod"
            echo "GOPATH=$RUNNER_TEMP/devtools45-after-go-path"
          } >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          data = base64.b64decode('', validate=True)
          assert hashlib.sha256(data).hexdigest() == '9a378808b26a4bcc32b0fd312062e996b5e2a3030d4029f1d809003d784cdb18'
          packet = json.loads(zlib.decompress(data))
          root = Path(os.environ['RUNNER_TEMP']) / 'devtools45-after'
          root.mkdir()
          assert set(packet['files']) == set(packet['sha256'])
          for name, text in packet['files'].items():
              assert '/' not in name and name not in ('.', '..')
              data = text.encode()
              assert hashlib.sha256(data).hexdigest() == packet['sha256'][name], name
              (root / name).write_bytes(data)
          print('DEVTOOLS45_PACKET_SHA256 ' + json.dumps(packet['sha256'], sort_keys=True))
          PYTHON
      - name: Permanent owner RED, candidate GREEN, full native checks and unchanged sixteen cases
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/devtools45-after/native_after.py" "$GITHUB_WORKSPACE/original" "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/devtools45-after" "$CANDIDATE_SHA"
